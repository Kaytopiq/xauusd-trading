name: XAUUSD Auto Analysis

'on':
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance mplfinance pandas requests playwright
          python3 -m playwright install chromium 2>&1 | tail -3

      - name: Run analysis
        run: |
          echo "## XAUUSD AUTO ANALYSIS" > report.md
          echo "" >> report.md
          echo "Waktu: $(date '+%Y-%m-%d %H:%M UTC')" >> report.md
          echo "" >> report.md
          echo '--- MTF DASHBOARD ---' >> report.md
          bash scripts/mtf_dashboard.sh >> report.md 2>/dev/null
          echo "" >> report.md
          echo '--- SESSION ---' >> report.md
          bash scripts/session.sh >> report.md 2>/dev/null
          echo "" >> report.md
          echo '--- SIGNAL ---' >> report.md
          bash scripts/signal.sh >> report.md 2>/dev/null
          echo "" >> report.md
          echo '--- MONITOR ---' >> report.md
          bash scripts/monitor.sh >> report.md 2>/dev/null

      - name: Send report to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 -c "
          import requests, os
          token = os.environ.get('TG_BOT_TOKEN')
          chat_id = os.environ.get('TG_CHAT_ID')
          if not token or not chat_id:
              print('Secrets not set')
              exit(1)
          with open('report.md') as f:
              text = f.read()
          if len(text) > 4000:
              text = text[:2000] + '\n... (truncated)'
          url = f'https://api.telegram.org/bot{token}/sendMessage'
          r = requests.post(url, data={'chat_id': chat_id, 'text': text, 'parse_mode': 'Markdown'})
          print('OK' if r.json().get('ok') else r.text)
          "

      - name: Generate chart (TradingView)
        run: |
          bash scripts/chart_tv.sh 5 "chart_latest"

      - name: Send chart to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 -c "
          import requests, os
          token = os.environ.get('TG_BOT_TOKEN')
          chat_id = os.environ.get('TG_CHAT_ID')
          chart_path = 'analysis/chart_latest.png'
          if os.path.exists(chart_path):
              url = f'https://api.telegram.org/bot{token}/sendPhoto'
              with open(chart_path, 'rb') as f:
                  r = requests.post(url, data={'chat_id': chat_id}, files={'photo': f})
              print('OK' if r.json().get('ok') else r.text)
          else:
              print('No chart')
          "

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report
          path: |
            report.md
            analysis/*.png
